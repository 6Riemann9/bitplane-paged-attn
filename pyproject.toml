[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bitplane-paged-attn"
version = "0.1.0"
description = "面向混合架构长上下文大模型的位面渐进式页级 KV-Cache 解码研究与 Triton 算子实现"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.8.0",
    "transformers>=5.0.0",
    "accelerate>=1.0.0",
    "safetensors>=0.4.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "matplotlib>=3.8.0",
    "einops>=0.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
